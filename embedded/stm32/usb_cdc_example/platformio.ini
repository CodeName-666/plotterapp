[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = stm32cube
lib_deps =
    PlotterLib=symlink://../../common
build_flags =
    -std=c++11
    -DUSE_HAL_DRIVER
    -DSTM32F401xE
upload_protocol = stlink

